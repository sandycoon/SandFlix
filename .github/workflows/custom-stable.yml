name: Build SandFlix stable update
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Official stable Nuvio tag, or latest
        default: latest
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: sandflix-stable-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install reviewed build tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Check customization guards
        run: ./tests/Test-Patches.ps1
      - name: Look for a new upstream stable release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $requested = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { 'latest' }
          $endpoint = if ($requested -eq 'latest') { 'latest' } else { 'tags/' + [Uri]::EscapeDataString($requested) }
          $release = gh api "repos/NuvioMedia/NuvioTV/releases/$endpoint" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease -or $release.tag_name -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected stable release missing.' }
          $tag = $release.tag_name
          gh release view $tag --repo '${{ github.repository }}' 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          "version=$tag" >> $env:GITHUB_OUTPUT
          "needed=$(((-not $exists).ToString()).ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
      - name: Materialize signing key outside the checkout
        if: steps.upstream.outputs.needed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SANDFLIX_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'Missing SandFlix signing key secret.' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/sandflix.jks", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
      - name: Build and validate branded APK
        if: steps.upstream.outputs.needed == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          SANDFLIX_STORE_PASSWORD: ${{ secrets.SANDFLIX_STORE_PASSWORD }}
          SANDFLIX_KEY_PASSWORD: ${{ secrets.SANDFLIX_KEY_PASSWORD }}
        run: |
          ./Build-SandFlix.ps1 -Version $env:UPSTREAM_VERSION -ReleaseRepository '${{ github.repository }}' -KeystorePath "$env:RUNNER_TEMP/sandflix.jks" -AndroidBuildTools "$env:ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@v4
        if: steps.upstream.outputs.needed == 'true'
        with:
          name: sandflix-validated-build
          path: artifacts/
      - name: Create draft release for playback testing
        if: steps.upstream.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = Get-Content artifacts/build-report.json -Raw | ConvertFrom-Json
          $tag = $report.upstreamTag
          gh release view $tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This tag already has a release. Review it instead of replacing it.' }
          $notes = "SandFlix based on official Nuvio $tag. Branding, certificate, native-library hashes, and APK alignment verified. Playback testing is still required before publishing. APK SHA256: $($report.apkSha256). Upstream source: https://github.com/NuvioMedia/NuvioTV/tree/$tag"
          gh release create $tag --repo '${{ github.repository }}' --draft --title "SandFlix $tag" --notes $notes artifacts/app-full-armeabi-v7a-release.apk artifacts/build-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
      - name: Remove temporary signing key
        if: always()
        run: |
          $keyPath = [IO.Path]::GetFullPath("$env:RUNNER_TEMP/sandflix.jks")
          if ([IO.File]::Exists($keyPath)) { Remove-Item -LiteralPath $keyPath }
